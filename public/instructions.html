<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instructions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--surf:#111827;--surf2:#1a2236;--bdr:#1e2d47;--txt:#e2e8f4;--muted:#64748b;--accent:#2AABEE;--accentd:#229ED9;--ok:#22c55e;--warn:#f59e0b;--r:18px;--rs:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh}

/* HERO */
.hero{background:linear-gradient(135deg,#0f1a2e 0%,#0d1f3c 40%,#0a1628 100%);border-bottom:1px solid var(--bdr);padding:3rem 1.5rem 2.5rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(42,171,238,.12),transparent);pointer-events:none}
.hero-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accentd));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 1.25rem;box-shadow:0 8px 32px rgba(42,171,238,.3)}
.hero h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;margin-bottom:.5rem;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:.95rem;max-width:480px;margin:0 auto;line-height:1.6}

/* CONTAINER */
.wrap{max-width:680px;margin:0 auto;padding:2rem 1.1rem 4rem}

/* BLOCKS */
.block{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:1rem;overflow:hidden;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.block:nth-child(1){animation-delay:.05s}.block:nth-child(2){animation-delay:.1s}.block:nth-child(3){animation-delay:.15s}.block:nth-child(4){animation-delay:.2s}.block:nth-child(5){animation-delay:.25s}
.bdy{padding:1.3rem 1.5rem}

/* PARAGRAPH */
.para{font-size:.93rem;line-height:1.8;color:var(--txt);white-space:pre-wrap;word-break:break-word}

/* STEPS */
.blk-ttl{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.step-li{display:flex;align-items:flex-start;gap:.75rem;padding:.65rem 0;border-bottom:1px solid var(--bdr)}
.step-li:last-child{border-bottom:none}
.step-num{min-width:1.8rem;height:1.8rem;background:linear-gradient(135deg,var(--accent),var(--accentd));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(42,171,238,.35)}
.step-txt{font-size:.9rem;line-height:1.55;padding-top:.12rem}

/* LINKBOX */
.lb-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:.5rem}
.lb-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
.copy-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.38rem .75rem;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--muted);font-size:.77rem;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(42,171,238,.08)}
.copy-btn.ok{border-color:var(--ok);color:var(--ok)}
.li-row{display:flex;align-items:flex-start;gap:.65rem;padding:.55rem 0;border-bottom:1px solid var(--bdr)}
.li-row:last-child{border-bottom:none}
.li-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:.45rem}
.li-label{font-size:.82rem;font-weight:700;min-width:90px;color:var(--txt)}
.li-url{font-size:.78rem;color:var(--accent);text-decoration:none;flex:1;word-break:break-all}
.li-url:hover{text-decoration:underline}
.li-plain{font-size:.82rem;color:var(--muted);flex:1;word-break:break-word}

/* LOADING */
.skel{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r);height:80px;margin-bottom:1rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── PROOFS SECTION ─────────────────────────────────────── */
.section-divider{display:flex;align-items:center;gap:1rem;margin:2.5rem 0 1.5rem}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
.section-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}

.proofs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.85rem;margin-bottom:2rem}
.proof-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fadeUp .4s ease both}
.proof-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.proof-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--surf2)}
.proof-info{padding:.75rem .9rem}
.proof-task{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:99px;background:rgba(42,171,238,.12);color:var(--accent);border:1px solid rgba(42,171,238,.25);margin-bottom:.4rem}
.proof-desc{font-size:.78rem;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.proof-date{font-size:.7rem;color:var(--muted);margin-top:.35rem;opacity:.7}
.no-proofs{text-align:center;padding:2.5rem 1rem;color:var(--muted);border:1px dashed var(--bdr);border-radius:var(--r)}
.no-proofs span{font-size:2rem;display:block;margin-bottom:.75rem}

/* SUBMIT PROOF */
.submit-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.submit-hdr{padding:1.1rem 1.4rem;background:var(--surf2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:.6rem}
.submit-hdr h3{font-size:.95rem;font-weight:700}
.submit-body{padding:1.4rem}
.fg{margin-bottom:.9rem}
.flbl{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.38rem}
.fi{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rs);padding:.65rem .85rem;color:var(--txt);font-size:.88rem;font-family:inherit;transition:border-color .18s}
.fi:focus{outline:none;border-color:var(--accent)}
.fi-file{padding:.5rem;cursor:pointer}
.img-prev{width:100%;max-height:200px;object-fit:contain;border-radius:var(--rs);background:var(--surf2);display:none;margin-top:.5rem}
.btn{padding:.65rem 1.2rem;border-radius:var(--rs);font-size:.85rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .18s;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accentd));color:#fff;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{padding:.65rem .9rem;border-radius:var(--rs);font-size:.83rem;font-weight:500;margin-top:.75rem;display:none}
.msg-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--ok)}
.msg-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171}

/* LIGHTBOX */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.lb.open{display:flex}
.lb-inner{position:relative;max-width:90vw;max-height:90vh}
.lb img{max-width:100%;max-height:85vh;border-radius:var(--rs);display:block}
.lb-info{text-align:center;margin-top:.75rem;color:#fff}
.lb-task{font-size:.82rem;font-weight:700;color:var(--accent)}
.lb-desc{font-size:.78rem;color:rgba(255,255,255,.7);margin-top:.2rem}
.lb-close{position:absolute;top:-.5rem;right:-.5rem;width:2rem;height:2rem;background:#fff;border:none;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111}
.empty-blocks{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-blocks span{font-size:2.5rem;display:block;margin-bottom:.75rem}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-icon">📋</div>
  <h1>Instructions</h1>
  <p id="hero-sub">Loading guide...</p>
</div>

<div class="wrap">

  <!-- Instruction Blocks -->
  <div id="blocks">
    <div class="skel"></div>
    <div class="skel" style="height:120px;animation-delay:.1s"></div>
    <div class="skel" style="animation-delay:.2s"></div>
  </div>

  <!-- Proofs Section -->
  <div class="section-divider"><span class="section-label">✅ Task Proofs</span></div>

  <div id="proofs-grid" class="proofs-grid"></div>

  <!-- Submit Proof -->
  <div class="submit-card">
    <div class="submit-hdr">
      <span style="font-size:1.2rem">📸</span>
      <h3>Submit Your Proof</h3>
    </div>
    <div class="submit-body">
      <div class="fg">
        <label class="flbl">Task Name *</label>
        <input class="fi" id="pf-task" placeholder="e.g. WoolRush Bot Referral" maxlength="255">
      </div>
      <div class="fg">
        <label class="flbl">Description (optional)</label>
        <input class="fi" id="pf-desc" placeholder="Brief note about this proof" maxlength="500">
      </div>
      <div class="fg">
        <label class="flbl">Screenshot / Proof Image *</label>
        <input type="file" class="fi fi-file" id="pf-img" accept="image/*" onchange="previewProofImg(this)">
        <img id="pf-preview" class="img-prev" alt="Preview">
      </div>
      <button class="btn btn-primary" id="pf-submit" onclick="submitProof()">📤 Submit Proof</button>
      <div class="msg msg-ok" id="pf-ok">✅ Proof submitted! Thank you.</div>
      <div class="msg msg-err" id="pf-err"></div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLb(event)">
  <div class="lb-inner">
    <button class="lb-close" onclick="document.getElementById('lb').classList.remove('open')">✕</button>
    <img id="lb-img" src="" alt="">
    <div class="lb-info">
      <div class="lb-task" id="lb-task"></div>
      <div class="lb-desc" id="lb-desc"></div>
    </div>
  </div>
</div>

<script>
// ── Load Instruction Blocks ─────────────────────────────────────────────────
async function loadBlocks() {
  const el = document.getElementById('blocks');
  try {
    const r = await fetch('/api/instructions');
    const data = await r.json();
    const blocks = data.blocks || [];
    el.innerHTML = '';
    if (!blocks.length) {
      el.innerHTML = `<div class="empty-blocks"><span>📝</span><p>No instructions added yet.</p></div>`;
      document.getElementById('hero-sub').textContent = 'Check back soon for instructions.';
      return;
    }
    document.getElementById('hero-sub').textContent = `${blocks.length} section${blocks.length>1?'s':''} — read carefully before proceeding`;
    blocks.forEach((b, i) => {
      const div = document.createElement('div');
      div.className = 'block';
      div.style.animationDelay = `${i * 0.07}s`;
      div.innerHTML = renderBlock(b);
      el.appendChild(div);
    });
  } catch(e) {
    el.innerHTML = `<div class="empty-blocks"><span>⚠️</span><p>Failed to load instructions.</p></div>`;
  }
}

function renderBlock(b) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (b.type === 'paragraph') {
    return `<div class="bdy"><div class="para">${esc(b.content||'')}</div></div>`;
  }
  if (b.type === 'steps') {
    const steps = (b.steps||[]).map((s,i) => `<li class="step-li"><span class="step-num">${i+1}</span><span class="step-txt">${esc(s)}</span></li>`).join('');
    return `<div class="bdy">${b.title?`<div class="blk-ttl">🔢 ${esc(b.title)}</div>`:''}<ul style="list-style:none">${steps}</ul></div>`;
  }
  if (b.type === 'linkbox') {
    const id = 'cp_'+b.id;
    const items = (b.items||[]).map(it => {
      const isUrl = it.url && (it.url.startsWith('http')||it.url.startsWith('tg://'));
      return `<div class="li-row"><span class="li-dot"></span><span class="li-label">${esc(it.label||'')}</span>${isUrl?`<a class="li-url" href="${esc(it.url)}" target="_blank">${esc(it.url)}</a>`:`<span class="li-plain">${esc(it.url||'')}</span>`}</div>`;
    }).join('');
    return `<div class="bdy"><div class="lb-hdr"><div class="lb-title">🔗 ${esc(b.title||'Links')}</div><button class="copy-btn" id="${id}" onclick="copyBox('${b.id}','${id}')">📋 Copy All</button></div>${items}</div>`;
  }
  if (b.type === 'image') {
    const alignMap = {left:'flex-start',center:'center',right:'flex-end'};
    const justify = alignMap[b.align||'center']||'center';
    if (!b.src) return '';
    return `<div class="bdy"><div style="display:flex;justify-content:${justify}"><img src="${b.src}" alt="${esc(b.caption||'')}" style="max-width:100%;border-radius:10px"></div>${b.caption?`<p style="text-align:${b.align||'center'};font-size:.8rem;color:var(--muted);margin-top:.6rem;font-style:italic">${esc(b.caption)}</p>`:''}</div>`;
  }
  return '';
}

// ── Copy Link Box ───────────────────────────────────────────────────────────
let _blocksCache = [];
async function getBlocks() {
  if (!_blocksCache.length) {
    const r = await fetch('/api/instructions');
    const d = await r.json();
    _blocksCache = d.blocks || [];
  }
  return _blocksCache;
}

async function copyBox(id, btnId) {
  const blocks = await getBlocks();
  const b = blocks.find(x => x.id === id); if (!b) return;
  const lines = [`📌 ${b.title||'Links'}`, ''];
  (b.items||[]).forEach(it => { lines.push(it.label && it.url ? `${it.label}\n${it.url}` : it.url||it.label); lines.push(''); });
  navigator.clipboard.writeText(lines.join('\n').trim()).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ Copied!'; btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('ok'); }, 2000);
  });
}

// ── Load Proofs ─────────────────────────────────────────────────────────────
async function loadProofs() {
  const grid = document.getElementById('proofs-grid');
  try {
    const r = await fetch('/api/proofs');
    const data = await r.json();
    const proofs = data.proofs || [];
    if (!proofs.length) {
      grid.innerHTML = `<div class="no-proofs" style="grid-column:1/-1"><span>🖼️</span><p>No proofs submitted yet. Be the first!</p></div>`;
      return;
    }
    grid.innerHTML = proofs.map((p,i) => `
      <div class="proof-card" style="animation-delay:${i*0.06}s" onclick="openLb('${p.id}')">
        <img class="proof-img" src="${p.image_data}" alt="${escAttr(p.task_name)}" loading="lazy">
        <div class="proof-info">
          <div class="proof-task">✅ ${esc(p.task_name)}</div>
          ${p.description?`<div class="proof-desc">${esc(p.description)}</div>`:''}
          <div class="proof-date">${new Date(p.submitted_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
        </div>
      </div>`).join('');
    window._proofs = proofs;
  } catch(e) {
    grid.innerHTML = `<div class="no-proofs" style="grid-column:1/-1"><span>⚠️</span><p>Could not load proofs.</p></div>`;
  }
}

// ── Lightbox ────────────────────────────────────────────────────────────────
function openLb(id) {
  const p = (window._proofs||[]).find(x => String(x.id) === String(id)); if (!p) return;
  document.getElementById('lb-img').src = p.image_data;
  document.getElementById('lb-task').textContent = '✅ ' + p.task_name;
  document.getElementById('lb-desc').textContent = p.description || '';
  document.getElementById('lb').classList.add('open');
}
function closeLb(e) { if (e.target === e.currentTarget) document.getElementById('lb').classList.remove('open'); }

// ── Submit Proof ────────────────────────────────────────────────────────────
function previewProofImg(input) {
  const prev = document.getElementById('pf-preview');
  if (!input.files[0]) { prev.style.display='none'; return; }
  const reader = new FileReader();
  reader.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
  reader.readAsDataURL(input.files[0]);
}

async function submitProof() {
  const task = document.getElementById('pf-task').value.trim();
  const desc = document.getElementById('pf-desc').value.trim();
  const file = document.getElementById('pf-img').files[0];
  const ok = document.getElementById('pf-ok');
  const err = document.getElementById('pf-err');
  ok.style.display = err.style.display = 'none';

  if (!task) { err.textContent = '⚠️ Task name is required.'; err.style.display = 'block'; return; }
  if (!file) { err.textContent = '⚠️ Please select a screenshot.'; err.style.display = 'block'; return; }

  const btn = document.getElementById('pf-submit');
  btn.disabled = true; btn.textContent = 'Uploading...';

  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const r = await fetch('/api/proofs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_name: task, description: desc, image_data: e.target.result })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Upload failed');
      ok.style.display = 'block';
      document.getElementById('pf-task').value = '';
      document.getElementById('pf-desc').value = '';
      document.getElementById('pf-img').value = '';
      document.getElementById('pf-preview').style.display = 'none';
      loadProofs(); // refresh gallery
    } catch(ex) {
      err.textContent = '❌ ' + ex.message; err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.innerHTML = '📤 Submit Proof';
    }
  };
  reader.readAsDataURL(file);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }

// ── Init ────────────────────────────────────────────────────────────────────
loadBlocks();
loadProofs();
</script>
</body>
</html>
