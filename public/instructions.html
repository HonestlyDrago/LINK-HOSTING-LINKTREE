<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instructions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--surf:#111827;--surf2:#1a2236;--bdr:#1e2d47;--txt:#e2e8f4;--muted:#64748b;--accent:#2AABEE;--accentd:#229ED9;--ok:#22c55e;--warn:#f59e0b;--r:18px;--rs:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh}

/* HERO */
.hero{background:linear-gradient(135deg,#0f1a2e 0%,#0d1f3c 40%,#0a1628 100%);border-bottom:1px solid var(--bdr);padding:1rem 1.5rem;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 0% 50%,rgba(42,171,238,.12),transparent);pointer-events:none}
.hero-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:1rem}
.hero-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accentd));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 16px rgba(42,171,238,.3);flex-shrink:0}
.hero-text{display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:1.1rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:.8rem;margin:0}

/* CONTAINER */
.wrap{max-width:680px;margin:0 auto;padding:2rem 1.1rem 4rem}

/* BLOCKS */
.block{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:1rem;overflow:hidden;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.block:nth-child(1){animation-delay:.05s}.block:nth-child(2){animation-delay:.1s}.block:nth-child(3){animation-delay:.15s}.block:nth-child(4){animation-delay:.2s}.block:nth-child(5){animation-delay:.25s}
.bdy{padding:1.3rem 1.5rem}

/* PARAGRAPH */
.para{font-size:.93rem;line-height:1.8;color:var(--txt);white-space:pre-wrap;word-break:break-word}

/* STEPS */
.blk-ttl{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.step-li{display:flex;align-items:flex-start;gap:.75rem;padding:.65rem 0;border-bottom:1px solid var(--bdr)}
.step-li:last-child{border-bottom:none}
.step-num{min-width:1.8rem;height:1.8rem;background:linear-gradient(135deg,var(--accent),var(--accentd));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(42,171,238,.35)}
.step-txt{font-size:.9rem;line-height:1.55;padding-top:.12rem}

/* LINKBOX */
.lb-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.lb-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.45rem}
.copy-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.38rem .75rem;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--muted);font-size:.77rem;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(42,171,238,.08)}
.copy-btn.ok{border-color:var(--ok);color:var(--ok)}

.li-btn{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;padding:.8rem 1rem;margin-bottom:.75rem;transition:border-color .2s}
.li-btn:last-child{margin-bottom:0}
.li-btn:hover{border-color:var(--muted)}
.li-btn-left{display:flex;align-items:center;gap:.75rem;flex:1;min-width:0}
.li-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt);flex-shrink:0}
.li-icon.tg{background:#2AABEE;color:#fff}
.li-icon.yt{background:#FF0000;color:#fff}
.li-icon.def{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}
.li-label{font-size:.9rem;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.li-copy-btn{width:32px;height:32px;border-radius:50%;background:var(--surf2);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:all .2s;padding:0}
.li-copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.li-copy-btn.ok{color:var(--ok);border-color:var(--ok)}
.li-go-btn{color:var(--muted);display:flex;align-items:center;justify-content:center;padding:.2rem;margin-left:.1rem;transition:color .2s}
.li-go-btn:hover{color:var(--txt)}

/* PROOFBOX */
.pb-wrap{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);padding:1.25rem 1.4rem;display:flex;flex-direction:column;gap:.85rem}
.pb-title{font-size:.95rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:.45rem}
.pb-input, .pb-file{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:.6rem .8rem;color:var(--txt);font-size:.85rem;font-family:inherit;outline:none;transition:border-color .2s}
.pb-input:focus{border-color:var(--accent)}
.pb-btn{width:100%;padding:.65rem;background:linear-gradient(135deg,var(--accent),var(--accentd));color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
.pb-btn:disabled{opacity:0.6;cursor:not-allowed}
.pb-msg{font-size:.8rem;font-weight:500;padding:.6rem .8rem;border-radius:8px;display:none}
.pb-msg.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e;display:block}
.pb-msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;display:block}

/* LOADING */
.skel{background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r);height:80px;margin-bottom:1rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.empty-blocks{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-blocks span{font-size:2.5rem;display:block;margin-bottom:.75rem}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-icon">📋</div>
    <div class="hero-text">
      <h1>Instructions</h1>
      <p id="hero-sub">Loading guide...</p>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- Instruction Blocks -->
  <div id="blocks">
    <div class="skel"></div>
    <div class="skel" style="height:120px;animation-delay:.1s"></div>
    <div class="skel" style="animation-delay:.2s"></div>
  </div>

  <!-- Proof Submit Form Removed from global, now handled by blocks -->
  </div>

</div>


<script>
// ── Load Instruction Blocks ─────────────────────────────────────────────────
async function loadBlocks() {
  const el = document.getElementById('blocks');
  try {
    const r = await fetch('/api/instructions');
    const data = await r.json();
    const blocks = data.blocks || [];
    el.innerHTML = '';
    if (!blocks.length) {
      el.innerHTML = `<div class="empty-blocks"><span>📝</span><p>No instructions added yet.</p></div>`;
      document.getElementById('hero-sub').textContent = 'Check back soon for instructions.';
      return;
    }
    document.getElementById('hero-sub').textContent = `${blocks.length} section${blocks.length>1?'s':''} — read carefully before proceeding`;
    blocks.forEach((b, i) => {
      const div = document.createElement('div');
      div.className = 'block';
      div.style.animationDelay = `${i * 0.07}s`;
      div.innerHTML = renderBlock(b);
      el.appendChild(div);
    });
  } catch(e) {
    el.innerHTML = `<div class="empty-blocks"><span>⚠️</span><p>Failed to load instructions.</p></div>`;
  }
}

function renderBlock(b) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (b.type === 'paragraph') {
    return `<div class="bdy"><div class="para">${esc(b.content||'')}</div></div>`;
  }
  if (b.type === 'steps') {
    const steps = (b.steps||[]).map((s,i) => `<li class="step-li"><span class="step-num">${i+1}</span><span class="step-txt">${esc(s)}</span></li>`).join('');
    return `<div class="bdy">${b.title?`<div class="blk-ttl">🔢 ${esc(b.title)}</div>`:''}<ul style="list-style:none">${steps}</ul></div>`;
  }
  if (b.type === 'linkbox') {
    const id = 'cp_'+b.id;
    const items = (b.items||[]).map((it, idx) => {
      const urlStr = it.url || '';
      const isUrl = urlStr.startsWith('http') || urlStr.startsWith('tg://');
      const isTg = urlStr.includes('t.me/') || urlStr.includes('tg://');
      
      let iconClass = 'def';
      let iconSvg = '<svg fill="currentColor" viewBox="0 0 24 24" width="14" height="14"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>';
      
      if (isUrl) {
        if (isTg) {
          iconClass = 'tg';
          iconSvg = '<svg fill="#fff" viewBox="0 0 24 24" width="14" height="14"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.89 8.24l-1.97 9.27c-.15.65-.53.81-1.08.5l-3-2.21-1.45 1.4c-.16.16-.3.3-.61.3l.21-3.05 5.56-5.02c.24-.22-.05-.34-.37-.12l-6.87 4.33-2.96-.92c-.64-.2-.65-.64.13-.95l11.56-4.45c.53-.2.99.12.85.92z"/></svg>';
        } else if (urlStr.includes('youtube.com') || urlStr.includes('youtu.be')) {
          iconClass = 'yt';
          iconSvg = '<svg fill="#fff" viewBox="0 0 24 24" width="14" height="14"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>';
        }
      }

      const copyId = `cp_btn_${b.id}_${idx}`;
      const copySvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      const goSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

      const labelText = it.label ? esc(it.label) : esc(urlStr || 'Link');
      const showUrl = it.label && urlStr && it.label !== urlStr;

      return `<div class="li-btn">
        <div class="li-btn-left">
          <div class="li-icon ${iconClass}">${iconSvg}</div>
          <div style="display:flex;flex-direction:column;min-width:0;flex:1">
            <div class="li-label" style="white-space:normal;overflow:visible;line-height:1.4">${labelText}</div>
            ${showUrl ? `<div style="font-size:.75rem;color:${isUrl?'var(--accent)':'var(--muted)'};word-break:break-all;margin-top:.25rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">${esc(urlStr)}</div>` : ''}
          </div>
        </div>
        <div class="li-actions">
          <button class="li-copy-btn" id="${copyId}" title="Copy" onclick="copySingleUrl('${esc(urlStr)}', '${copyId}')">${copySvg}</button>
          ${isUrl ? `<a href="${isTg ? '/tg.html?url='+encodeURIComponent(urlStr) : esc(urlStr)}" target="_blank" class="li-go-btn" title="Open Link">${goSvg}</a>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="bdy"><div class="lb-hdr"><div class="lb-title">🔗 ${esc(b.title||'Links')}</div><button class="copy-btn" id="${id}" onclick="copyBox('${b.id}','${id}')">📋 Copy All</button></div><div>${items}</div></div>`;
  }
  if (b.type === 'image') {
    const alignMap = {left:'flex-start',center:'center',right:'flex-end'};
    const justify = alignMap[b.align||'center']||'center';
    if (!b.src) return '';
    return `<div class="bdy"><div style="display:flex;justify-content:${justify}"><img src="${b.src}" alt="${esc(b.caption||'')}" style="max-width:100%;border-radius:10px"></div>${b.caption?`<p style="text-align:${b.align||'center'};font-size:.8rem;color:var(--muted);margin-top:.6rem;font-style:italic">${esc(b.caption)}</p>`:''}</div>`;
  }
  if (b.type === 'proofbox') {
    const hasImg = b.mode === 'image_and_text';
    return `<div class="bdy"><div class="pb-wrap" id="pb_${b.id}">
      <div class="pb-title">📸 ${esc(b.title||'Submit Proof')}</div>
      <input type="text" id="pb_desc_${b.id}" class="pb-input" placeholder="Your username or description (optional)" maxlength="500">
      ${hasImg ? `<input type="file" id="pb_img_${b.id}" class="pb-file" accept="image/*">` : ''}
      <button class="pb-btn" id="pb_btn_${b.id}" onclick="submitProofBlock('${b.id}', '${esc(b.title||'Submit Proof').replace(/'/g, "\\'")}', '${b.mode||'text_only'}')">📤 Submit Proof</button>
      <div class="pb-msg" id="pb_msg_${b.id}"></div>
    </div></div>`;
  }
  return '';
}

// ── Copy Link Box ───────────────────────────────────────────────────────────
let _blocksCache = [];
async function getBlocks() {
  if (!_blocksCache.length) {
    const r = await fetch('/api/instructions');
    const d = await r.json();
    _blocksCache = d.blocks || [];
  }
  return _blocksCache;
}

async function copyBox(id, btnId) {
  const blocks = await getBlocks();
  const b = blocks.find(x => x.id === id); if (!b) return;
  const lines = [`📌 ${b.title||'Links'}`, ''];
  (b.items||[]).forEach(it => { lines.push(it.label && it.url ? `${it.label}\n${it.url}` : it.url||it.label); lines.push(''); });
  navigator.clipboard.writeText(lines.join('\n').trim()).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ Copied!'; btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('ok'); }, 2000);
  });
}

window.copySingleUrl = function(text, btnId) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.innerHTML = '✅'; btn.classList.add('ok');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('ok'); }, 2000);
  });
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Proof Block Submissions ─────────────────────────────────────────────────
async function submitProofBlock(id, taskName, mode) {
  const descEl = document.getElementById('pb_desc_'+id);
  const imgEl  = document.getElementById('pb_img_'+id);
  const btn    = document.getElementById('pb_btn_'+id);
  const msg    = document.getElementById('pb_msg_'+id);

  const effectiveMode = (mode && mode !== 'undefined') ? mode : 'text_only';
  const desc = descEl ? descEl.value.trim() : '';
  msg.className = 'pb-msg'; msg.textContent = '';

  if (effectiveMode === 'text_only') {
    if (!desc) {
      msg.className = 'pb-msg err'; msg.textContent = '⚠️ Please enter a description.'; return;
    }
  }

  const file = effectiveMode === 'image_and_text' && imgEl ? imgEl.files[0] : null;
  if (effectiveMode === 'image_and_text' && !file) {
    msg.className = 'pb-msg err'; msg.textContent = '⚠️ Please select a screenshot.'; return;
  }
  
  btn.disabled = true; btn.textContent = 'Uploading...';
  
  const doSubmit = async (imageData) => {
    try {
      const r = await fetch('/api/proofs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_name: taskName, description: desc, image_data: imageData || null })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Upload failed');
      msg.className = 'pb-msg ok'; msg.textContent = '✅ Proof submitted! Thank you.';
      if (descEl) descEl.value = '';
      if (imgEl) imgEl.value = '';
    } catch(ex) {
      msg.className = 'pb-msg err'; msg.textContent = '❌ ' + ex.message;
    } finally {
      btn.disabled = false; btn.textContent = '📤 Submit Proof';
    }
  };

  if (file) {
    const reader = new FileReader();
    reader.onload = e => doSubmit(e.target.result);
    reader.readAsDataURL(file);
  } else {
    doSubmit(null);
  }
}

// ── Init ────────────────────────────────────────────────────────────────────
loadBlocks();
</script>
</body>
</html>
