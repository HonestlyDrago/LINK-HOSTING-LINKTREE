<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | License Keys History</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 🔒 Password Protection Overlay Modal -->
  <div class="modal-overlay" id="auth-modal" style="display: none;">
    <div class="modal-content">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <i class="fa-solid fa-lock" style="font-size: 2.2rem; color: var(--primary); margin-bottom: 0.8rem;"></i>
        <h2 style="font-weight: 700; font-size: 1.4rem;">Admin Verification</h2>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.25rem;">Enter your password to view license history.</p>
      </div>
      
      <div id="auth-error-container"></div>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="auth-password">Admin Password / Access Token</label>
          <input type="password" id="auth-password" class="form-input" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Authenticate
        </button>
      </form>
    </div>
  </div>

  <!-- 📊 Main Dashboard Interface -->
  <div class="admin-container">
    
    <!-- Header Row -->
    <header class="admin-header">
      <div>
        <h1 class="admin-title"><i class="fa-solid fa-key" style="color: var(--primary)"></i> License Keys History</h1>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.3rem;">
          View all license keys generated by pumps. This information is strictly private.
        </p>
      </div>
      <div style="display: flex; gap: 0.8rem; flex-wrap:wrap;">
        <a href="/admin" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to Main Admin</a>
        <button class="btn btn-secondary" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </header>

    <!-- Licenses Table -->
    <section class="panel" style="min-height: 380px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 class="panel-title" style="margin-bottom: 0;"><i class="fa-solid fa-list-ul" style="color: var(--primary)"></i> Generated Licenses</h2>
        <button class="btn btn-secondary" onclick="loadLicenses()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
      </div>
      
      <div class="table-responsive">
        <table class="link-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Pump Name</th>
              <th>Hardware ID</th>
              <th>Generated At</th>
            </tr>
          </thead>
          <tbody id="licenses-tbody">
            <!-- JS-loaded table rows -->
            <tr>
              <td colspan="4" class="empty-state">
                <div class="empty-icon"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                <p>Loading license history...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // Core Init checks
    document.addEventListener('DOMContentLoaded', () => {
      checkAuthentication();
    });

    // Helper: Retrieve saved authorization token
    function getAuthToken() {
      return localStorage.getItem('admin_token') || '';
    }

    // Auth Control check
    function checkAuthentication() {
      const token = getAuthToken();
      if (!token) {
        document.getElementById('auth-modal').style.display = 'flex';
      } else {
        document.getElementById('auth-modal').style.display = 'none';
        loadLicenses();
      }
    }

    // Login Form Submit
    function handleAuthSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('auth-password').value.trim();
      localStorage.setItem('admin_token', pwd);
      checkAuthentication();
    }

    // Logout Helper
    function logout() {
      localStorage.removeItem('admin_token');
      location.reload();
    }

    // Load active licenses list
    async function loadLicenses() {
      const tbody = document.getElementById('licenses-tbody');
      const token = getAuthToken();

      tbody.innerHTML = `<tr><td colspan="4" class="empty-state"><div class="empty-icon"><i class="fa-solid fa-circle-notch fa-spin"></i></div><p>Loading...</p></td></tr>`;

      try {
        const response = await fetch('/api/licenses', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await response.json();
        
        if (response.status === 401) {
          // Token invalid, force re-login
          localStorage.removeItem('admin_token');
          checkAuthentication();
          return;
        }

        if (!response.ok) {
          throw new Error(data.error || 'Failed to fetch licenses');
        }

        if (!data.licenses || data.licenses.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty-state"><div class="empty-icon"><i class="fa-solid fa-key"></i></div><p>No licenses generated yet.</p></td></tr>`;
          return;
        }

        // Render rows
        tbody.innerHTML = '';
        data.licenses.forEach(lic => {
          const row = document.createElement('tr');
          const d = new Date(lic.created_at);
          
          row.innerHTML = `
            <td><span class="slug-badge">#${lic.id}</span></td>
            <td><strong>${escapeHtml(lic.pump_name)}</strong></td>
            <td style="font-family: monospace; font-size: 0.85rem; color: var(--text-secondary);">${escapeHtml(lic.hardware_id)}</td>
            <td style="color: var(--text-secondary); font-size: 0.9rem;">${d.toLocaleString()}</td>
          `;
          tbody.appendChild(row);
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state"><div class="empty-icon" style="color:var(--error)"><i class="fa-solid fa-triangle-exclamation"></i></div><p>${err.message}</p></td></tr>`;
      }
    }

    // Basic HTML escaper
    function escapeHtml(unsafe) {
        return (unsafe || '').toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
