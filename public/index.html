<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect & Explore | My Links</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- FontAwesome for fallback styling just in case -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="tree-container">
    
    <!-- Profile Header -->
    <header class="profile-card">
      <div class="profile-avatar">
        <!-- Sleek local profile picture -->
        <img src="/avatar.png" alt="Avatar" id="profile-img">
      </div>
      <h1 class="profile-name" id="profile-title">Quick Tasks & Social Hub</h1>
      <p class="profile-bio" id="profile-desc">Welcome! Click any link below to instantly access my micro-jobs, active tasks, channels, and portals.</p>
    </header>

    <!-- Dynamic Links Section -->
    <main class="links-list" id="links-container">
      <!-- Loading skeletons (replaced by JS) -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card" style="animation-delay: 0.2s"></div>
      <div class="skeleton-card" style="animation-delay: 0.4s"></div>
    </main>

    <!-- Instructions Preview Card -->
    <div id="instr-preview" style="display:none;margin-top:.5rem;">
      <a href="/instructions" class="link-card" style="background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(42,171,238,.08));border-color:rgba(99,102,241,.25);">
        <div class="link-card-left">
          <span class="link-icon"><i class="fa-solid fa-book-open" style="color:#818cf8;"></i></span>
          <div class="link-text-content">
            <span class="link-title">Instructions</span>
            <p class="link-description" id="instr-preview-desc">How to get started &amp; important links</p>
          </div>
        </div>
        <div class="link-card-right">
          <span class="link-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </div>
      </a>
    </div>

    <!-- Social Bottom Icons -->
    <footer class="social-row">
      <a href="#" class="social-icon-btn" title="Telegram" id="footer-tg" style="display: none;"><i class="fab fa-telegram"></i></a>
      <a href="#" class="social-icon-btn" title="WhatsApp" id="footer-wa" style="display: none;"><i class="fab fa-whatsapp"></i></a>
      <a href="#" class="social-icon-btn" title="YouTube" id="footer-yt" style="display: none;"><i class="fab fa-youtube"></i></a>
      <a href="#" class="social-icon-btn" title="TikTok" id="footer-tt" style="display: none;"><i class="fab fa-tiktok"></i></a>
      <a href="#" class="social-icon-btn" title="Instagram" id="footer-ig" style="display: none;"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-icon-btn" title="X (Twitter)" id="footer-x" style="display: none;"><i class="fab fa-x-twitter"></i></a>
      <a href="#" class="social-icon-btn" title="Pinterest" id="footer-pin" style="display: none;"><i class="fab fa-pinterest"></i></a>
      <a href="#" class="social-icon-btn" title="Reddit" id="footer-rd" style="display: none;"><i class="fab fa-reddit"></i></a>
      <a href="/admin" class="social-icon-btn" title="Manage Dashboard" style="opacity: 0.5;"><i class="fa-solid fa-gear"></i></a>
    </footer>

  </div>

  <script>
    // Platform-to-Icon mapper
    function getPlatformIcon(slug, url) {
      const lowerUrl = url.toLowerCase();
      const lowerSlug = slug.toLowerCase();
      
      // Check slug/URL terms for matching SVG icon
      if (lowerSlug.includes('telegram') || lowerSlug.includes('tg') || lowerUrl.includes('t.me') || lowerUrl.includes('telegram')) {
        return '<i class="fab fa-telegram" style="color: #0088cc;"></i>';
      }
      if (lowerSlug.includes('whatsapp') || lowerSlug.includes('wa') || lowerUrl.includes('wa.me') || lowerUrl.includes('whatsapp')) {
        return '<i class="fab fa-whatsapp" style="color: #25d366;"></i>';
      }
      if (lowerSlug.includes('youtube') || lowerSlug.includes('yt') || lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
        return '<i class="fab fa-youtube" style="color: #ff0000;"></i>';
      }
      if (lowerSlug.includes('fiverr') || lowerUrl.includes('fiverr.com')) {
        return '<i class="fa-solid fa-briefcase" style="color: #1dbf73;"></i>';
      }
      if (lowerSlug.includes('upwork') || lowerUrl.includes('upwork.com')) {
        return '<i class="fa-solid fa-briefcase" style="color: #14a800;"></i>';
      }
      if (lowerSlug.includes('twitter') || lowerSlug.includes('x') || lowerUrl.includes('twitter.com') || lowerUrl.includes('x.com')) {
        return '<i class="fab fa-x-twitter" style="color: #ffffff;"></i>';
      }
      if (lowerSlug.includes('instagram') || lowerSlug.includes('ig') || lowerUrl.includes('instagram.com')) {
        return '<i class="fab fa-instagram" style="color: #e1306c;"></i>';
      }
      if (lowerSlug.includes('tiktok') || lowerSlug.includes('tt') || lowerUrl.includes('tiktok.com')) {
        return '<i class="fab fa-tiktok" style="color: #ffffff;"></i>';
      }
      if (lowerSlug.includes('pinterest') || lowerSlug.includes('pin') || lowerUrl.includes('pinterest.com')) {
        return '<i class="fab fa-pinterest" style="color: #bd081c;"></i>';
      }
      if (lowerSlug.includes('reddit') || lowerSlug.includes('rd') || lowerUrl.includes('reddit.com')) {
        return '<i class="fab fa-reddit" style="color: #ff4500;"></i>';
      }
      if (lowerSlug.includes('github') || lowerUrl.includes('github.com')) {
        return '<i class="fab fa-github" style="color: #f0f6fc;"></i>';
      }
      
      // Default fallback web icon
      return '<i class="fa-solid fa-link" style="color: #6366f1;"></i>';
    }

    // Fetch active links from Serverless API
    async function loadLinks() {
      const container = document.getElementById('links-container');
      try {
        const response = await fetch('/api/links');
        if (!response.ok) throw new Error('Failed to retrieve links');
        
        const data = await response.json();
        const links = data.links || [];

        // Clear skeletons
        container.innerHTML = '';

        if (links.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fa-regular fa-folder-open"></i></div>
              <p>No active links available right now.</p>
              <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.6">Visit /admin to add new redirect routes!</p>
            </div>
          `;
          return;
        }

        // 1. Identify which link should be mapped to each social footer slot
        let footerTgLink = null;
        let footerWaLink = null;
        let footerYtLink = null;
        let footerTtLink = null;
        let footerIgLink = null;
        let footerXLink = null;
        let footerPinLink = null;
        let footerRdLink = null;

        // Group matches for all platforms
        const tgLinks = [];
        const waLinks = [];
        const ytLinks = [];
        const ttLinks = [];
        const igLinks = [];
        const xLinks = [];
        const pinLinks = [];
        const rdLinks = [];

        links.forEach(link => {
          const destLower = link.destination_url.toLowerCase();
          const slugLower = link.slug.toLowerCase();

          if (slugLower === 'telegram' || slugLower === 'tg' || destLower.includes('t.me/')) {
            tgLinks.push(link);
          }
          if (slugLower === 'whatsapp' || slugLower === 'wa' || destLower.includes('wa.me/')) {
            waLinks.push(link);
          }
          if (slugLower === 'youtube' || slugLower === 'yt' || destLower.includes('youtube.com/') || destLower.includes('youtu.be/')) {
            ytLinks.push(link);
          }
          if (slugLower === 'tiktok' || slugLower === 'tt' || destLower.includes('tiktok.com/')) {
            ttLinks.push(link);
          }
          if (slugLower === 'instagram' || slugLower === 'ig' || slugLower === 'insta' || destLower.includes('instagram.com/')) {
            igLinks.push(link);
          }
          if (slugLower === 'x' || slugLower === 'twitter' || destLower.includes('x.com/') || destLower.includes('twitter.com/')) {
            xLinks.push(link);
          }
          if (slugLower === 'pinterest' || slugLower === 'pin' || destLower.includes('pinterest.com/')) {
            pinLinks.push(link);
          }
          if (slugLower === 'reddit' || slugLower === 'rd' || destLower.includes('reddit.com/')) {
            rdLinks.push(link);
          }
        });

        // Resolve footer slots: ONLY show if explicitly pinned
        footerTgLink = tgLinks.find(l => l.is_footer) || null;
        footerWaLink = waLinks.find(l => l.is_footer) || null;
        footerYtLink = ytLinks.find(l => l.is_footer) || null;
        footerTtLink = ttLinks.find(l => l.is_footer) || null;
        footerIgLink = igLinks.find(l => l.is_footer) || null;
        footerXLink = xLinks.find(l => l.is_footer) || null;
        footerPinLink = pinLinks.find(l => l.is_footer) || null;
        footerRdLink = rdLinks.find(l => l.is_footer) || null;

        // 2. Render footer social links if mapped
        const renderFooterIcon = (id, link) => {
          const el = document.getElementById(id);
          if (el) {
            if (link) {
              el.href = `/${link.slug}`;
              el.style.display = 'flex';
            } else {
              el.style.display = 'none';
            }
          }
        };

        renderFooterIcon('footer-tg', footerTgLink);
        renderFooterIcon('footer-wa', footerWaLink);
        renderFooterIcon('footer-yt', footerYtLink);
        renderFooterIcon('footer-tt', footerTtLink);
        renderFooterIcon('footer-ig', footerIgLink);
        renderFooterIcon('footer-x', footerXLink);
        renderFooterIcon('footer-pin', footerPinLink);
        renderFooterIcon('footer-rd', footerRdLink);

        // 3. Loop and render Linktree Cards
        links.forEach((link, index) => {
          // Skip the core system root 'active_link' setting from displaying as a main card
          if (link.slug === 'active_link') {
            return;
          }

          const card = document.createElement('a');
          card.href = `/${link.slug}`;
          card.className = 'link-card';
          card.style.animationDelay = `${index * 0.08}s`;
          
          // Format slug title
          const title = link.slug.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
          const icon = getPlatformIcon(link.slug, link.destination_url);

          card.innerHTML = `
            <div class="link-card-left">
              <span class="link-icon">${icon}</span>
              <div class="link-text-content">
                <span class="link-title">${title}</span>
                ${link.description ? `<p class="link-description">${link.description}</p>` : ''}
              </div>
            </div>
            <div class="link-card-right">
              <button class="card-copy-btn" onclick="copyCardUrl(event, '${link.slug}')" title="Copy Redirect Link">
                <i class="fa-regular fa-copy"></i>
              </button>
              <span class="link-arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </div>
          `;
          
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="alert alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Unable to load links. Please try again later.</span>
          </div>
        `;
      }
    }

    // Copy URL helper on landing page
    function copyCardUrl(e, slug) {
      e.preventDefault(); // Stop main redirect link click
      e.stopPropagation(); // Stop click event propagation
      
      const button = e.currentTarget;
      const originalHtml = button.innerHTML;
      const fullUrl = `${window.location.origin}/${slug}`;
      
      navigator.clipboard.writeText(fullUrl).then(() => {
        button.classList.add('copied');
        button.innerHTML = '<i class="fa-solid fa-check"></i>';
        
        setTimeout(() => {
          button.classList.remove('copied');
          button.innerHTML = originalHtml;
        }, 1500);
      }).catch(err => {
        console.error('Clipboard copy failed:', err);
      });
    }

    // Show Instructions card if content exists
    function initInstructionsCard() {
      try {
        const blocks = JSON.parse(localStorage.getItem('instr_blocks') || '[]');
        if (blocks.length > 0) {
          document.getElementById('instr-preview').style.display = 'block';
          // Find first paragraph/steps block for a preview description
          const first = blocks.find(b => b.type === 'paragraph' && b.content) ||
                        blocks.find(b => b.type === 'steps' && b.title);
          if (first) {
            const desc = first.type === 'paragraph'
              ? first.content.slice(0, 80).replace(/\n/g,' ') + (first.content.length > 80 ? '…' : '')
              : first.title;
            if (desc) document.getElementById('instr-preview-desc').textContent = desc;
          }
        }
      } catch(e) {}
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => { loadLinks(); initInstructionsCard(); });
  </script>
</body>
</html>
